<!DOCTYPE html>
<html>
<head>
  <title>测试 /api/auth/me 接口</title>
</head>
<body>
  <h2>测试 /api/auth/me 接口返回数据</h2>
  <div>
    <label>Token: <input id="token" type="text" style="width:400px" placeholder="粘贴学生登录后的 token"></label>
    <button onclick="testAuthMe()">测试接口</button>
  </div>
  <pre id="result" style="background:#f5f5f5;padding:10px;margin-top:10px"></pre>

  <script>
    async function testAuthMe() {
      const token = document.getElementById('token').value
      if (!token) {
        alert('请输入 token')
        return
      }

      try {
        const res = await fetch('http://26.6.49.51:8000/api/auth/me', {
          headers: { 'Authorization': 'Bearer ' + token }
        })
        const data = await res.json()
        document.getElementById('result').textContent = JSON.stringify(data, null, 2)
      } catch (e) {
        document.getElementById('result').textContent = '错误: ' + e.message
      }
    }
  </script>
</body>
</html>
